<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1467a8">
  <title>GongBoo.org</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(160deg,#f6fbff,#e8f2fb 55%,#fdf8ef);color:#102a43}.top{padding:max(30px,env(safe-area-inset-top)) 18px 26px;text-align:center;background:linear-gradient(135deg,#0e5f9c,#1978ba);color:#fff}.top h1{margin:0;font-size:clamp(27px,7.8vw,36px);font-weight:850;white-space:nowrap}.choices{display:grid;flex:1;grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;width:min(100%,430px);margin:auto;padding:30px 22px max(28px,env(safe-area-inset-bottom))}.choice{position:relative;display:grid;place-items:center;overflow:hidden;border:0;border-radius:28px;color:#fff;text-align:center;text-decoration:none;box-shadow:0 14px 30px rgba(25,70,108,.2);font-size:clamp(31px,8.7vw,42px);font-weight:850;line-height:1.08}.choice::after{content:"→";position:absolute;right:24px;bottom:18px;font-size:25px;opacity:.8}.bible{background:linear-gradient(140deg,#164f80,#0c6ca9)}.license{background:linear-gradient(140deg,#b96900,#e59518)}
  </style>
</head>
<body>
  <header class="top"><h1>GongBoo.org</h1></header>
  <main class="choices">
